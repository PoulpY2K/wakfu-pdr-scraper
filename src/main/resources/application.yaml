# Infos
info.app:
  environment: default
  artifactId: "@project.artifactId@"
  artifactVersion: "@project.version@"
  description: "@project.description@"
  locale: Europe/Paris

# Scraping depth. Category discovery intentionally covers recent pages only.
scraping:
  category-page-limit: 3
  topic-page-limit: 1000 # Fail rather than return partial topic content beyond this limit.

# Spring
spring:
  application:
    name: wakfu-pdr-scraper
  main:
    banner-mode: console
  threads.virtual.enabled: true
  output.ansi.enabled: ALWAYS
  devtools:
    add-properties: true
    # Prod
    # add-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    flyway:
      locations: classpath:db/migration

# Actuator
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,caches
  server:
    port: 8081
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
  info:
    env.enabled: true
    java.enabled: true
    db.enabled: true
  endpoint.health:
    show-details: always
    show-components: always
    probes:
      enabled: true
    status:
      http-mapping:
        down: 500
        warning: 500
        out-of-service: 503
      order: down,out-of-service,warning,unknown,up
    group:
      healthcheck:
        include:
          - db
        show-components: never
