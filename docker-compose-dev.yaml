services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: wakfu-scraper-db
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 1G
    volumes:
      - wakfu-scraper-db:/var/lib/postgresql:rw
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wakfu" ]
      retries: 5
      timeout: 5s
      interval: 10s
    environment:
      - POSTGRES_DB=wakfu_pdr
      - POSTGRES_USER=wakfu
      - POSTGRES_PASSWORD=wakfu
      - PGDATABASE=wakfu_pdr

volumes:
  wakfu-scraper-db:
    name: wakfu-scraper-db
    external: true